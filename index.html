<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Học & Kiểm Tra Quy Trình OM</title>
    <link rel="manifest" href="manifest.json">
    <!-- Cấu hình riêng cho iPhone (iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OM Đào Tạo">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2965/2965306.png">
    <!-- Đổi màu thanh trạng thái cho Android -->
    <meta name="theme-color" content="#1a5e3a">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Đào Tạo Quy Trình OM Nướng</h1>
            <p>Chọn bài kiểm tra để bắt đầu</p>
        </header>
        
        <div id="menu-section" class="card">
            <button onclick="loadTest('bai-10-ngay.json')">Bài 10 Ngày</button>
            <button onclick="loadTest('quy-trinh-tu-van-mon-an.json')">Quy Trình Tư Vấn Món</button>
        </div>

        <div id="test-section" class="card hidden">
            <button class="back-btn" onclick="goBack()">🔙 Quay lại</button>
            <h2 id="test-title"></h2>
            <div id="questions-container"></div>
            <button class="submit-btn" onclick="submitTest()">Nộp Bài & Chấm Điểm</button>
        </div>

        <div id="result-section" class="card hidden">
            <h2>Kết Quả</h2>
            <p id="score-display"></p>
            <div id="feedback-container"></div>
            <button class="back-btn" onclick="goBack()">Làm bài khác</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
